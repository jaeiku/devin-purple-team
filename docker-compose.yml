name: devin-purple-team

x-common-env: &common-env
  DATABASE_URL: postgresql+psycopg://purple:${POSTGRES_PASSWORD:-purple}@postgres:5432/purple
  DEVIN_API_KEY: ${DEVIN_API_KEY:-}
  DEVIN_API_BASE: ${DEVIN_API_BASE:-https://api.devin.ai}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  SUPERSET_FORK_REPO: ${SUPERSET_FORK_REPO:-jaeiku/superset}
  MAX_ACU_PER_SESSION: ${MAX_ACU_PER_SESSION:-10}
  MAX_CONCURRENT_SESSIONS: ${MAX_CONCURRENT_SESSIONS:-2}
  GLOBAL_BUDGET_ACU_CEILING: ${GLOBAL_BUDGET_ACU_CEILING:-100}
  DEMO_MODE: ${DEMO_MODE:-true}
  BLUE_TEAM_URL: http://blue-team:8000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: purple
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purple}
      POSTGRES_DB: purple
    volumes:
      - purple-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purple -d purple"]
      interval: 5s
      timeout: 5s
      retries: 20

  red-team:
    build:
      context: .
      dockerfile: red-team/Dockerfile
    environment: *common-env
    ports:
      - "${RED_TEAM_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  blue-team:
    build:
      context: .
      dockerfile: blue-team/Dockerfile
    environment:
      <<: *common-env
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-15}
      SIMULATED_SESSION_SECONDS: ${SIMULATED_SESSION_SECONDS:-20}
    ports:
      - "${BLUE_TEAM_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment: *common-env
    ports:
      - "${DASHBOARD_PORT:-8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  purple-db:
