# Copy this file into the Superset fork as
#   .github/workflows/devin-remediation.yml
#
# It fires when the red team opens or labels an issue and hands the normalised
# issue to the blue team, which re-validates it against GitHub and owns
# guardrails, dedupe and state.
#
# BLUE_TEAM_URL must point to a reachable blue-team service (for example a
# public host or a Cloudflare/ngrok tunnel for a demo). BLUE_TEAM_TOKEN is
# recommended to authenticate the push delivery.
#
# Required repository secrets:
#   BLUE_TEAM_URL   - e.g. https://purple-demo.example.com
#   BLUE_TEAM_TOKEN - shared bearer token

name: Devin autonomous remediation

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  dispatch:
    # Only red-team / security issues qualify.
    if: >-
      contains(join(github.event.issue.labels.*.name, ','), 'red-team') ||
      contains(join(github.event.issue.labels.*.name, ','), 'security')
    runs-on: ubuntu-latest
    env:
      BLUE_TEAM_URL: ${{ secrets.BLUE_TEAM_URL }}
      BLUE_TEAM_TOKEN: ${{ secrets.BLUE_TEAM_TOKEN }}
    steps:
      - name: Build normalised issue payload
        id: payload
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          labels = [l for l in os.environ["LABELS"].split(",") if l]
          payload = {
              "issue_number": int(os.environ["ISSUE_NUMBER"]),
              "issue_url": os.environ["ISSUE_URL"],
              "title": os.environ["ISSUE_TITLE"],
              "body": os.environ.get("ISSUE_BODY") or "",
              "labels": labels,
              "repo": os.environ["REPO"],
          }
          print("json=" + json.dumps(payload))
          PY

      - name: Notify blue team backend
        if: env.BLUE_TEAM_URL != ''
        env:
          PAYLOAD: ${{ steps.payload.outputs.json }}
        run: |
          AUTH_HEADER=()
          if [ -n "$BLUE_TEAM_TOKEN" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer $BLUE_TEAM_TOKEN")
          fi
          curl --fail-with-body -sS -X POST \
            "${BLUE_TEAM_URL%/}/api/events/issue-opened" \
            -H 'Content-Type: application/json' \
            "${AUTH_HEADER[@]}" \
            -d "$PAYLOAD"
