[project]
name = "pt-shared"
version = "0.1.0"
description = "Shared datastore, config and logging for the Devin Purple Team platform"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0.30,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "psycopg[binary]>=3.1,<4",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pt_shared"]
